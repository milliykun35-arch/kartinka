<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5C3E" />
      <stop offset="50%" stop-color="#A8845C" />
      <stop offset="100%" stop-color="#5C3D1E" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7C5C3E" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="8" y="8" width="84" height="84" rx="22" fill="url(#gold)" filter="url(#shadow)" />
  <rect x="14" y="14" width="72" height="72" rx="16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" />

  <!-- Frame Icon -->
  <rect x="26" y="26" width="48" height="48" rx="8" fill="none" stroke="#FFFFFF" stroke-width="5" />

  <!-- Sun & Mountains inside Art Frame -->
  <circle cx="38" cy="38" r="5" fill="#FBBF24" />
  <path d="M26 62 L42 44 L54 58 L62 50 L74 62 Z" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Palette Sparkle -->
  <circle cx="70" cy="70" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
  <path d="M70 65 L71.5 68.5 L75 70 L71.5 71.5 L70 75 L68.5 71.5 L65 70 L68.5 68.5 Z" fill="#FFFFFF" />
</svg>